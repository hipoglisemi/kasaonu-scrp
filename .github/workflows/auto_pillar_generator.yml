# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SEO Pillar Page Auto-Generator

on:
  schedule:
    # Her Salı ve Perşembe Türkiye saati 10:00 (UTC 07:00)
    - cron: '11 7 * * 2,4'
  workflow_dispatch: # Manuel tetikleme (test için)

jobs:
  generate-pillar-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous SEO Pillar Generator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          USE_VERTEX_AI: "False"
          GEMINI_MODEL: "gemini-3.5-flash"
          REVERSE_KEYS: "True"
        run: |
          python scripts/auto_seo_pillar_generator.py

      - name: Bildirim Gönder
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.GMAIL_USER }}
          from: Kasaonu CI <${{ secrets.GMAIL_USER }}>
          subject: "${{ job.status == 'success' && '✅' || '❌' }} ${{ github.workflow }} — ${{ job.status }}"
          body: |
            Workflow: ${{ github.workflow }}
            Durum: ${{ job.status }}
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Tetikleyen: ${{ github.event_name }}
            Çalışma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Detaylar için yukarıdaki linke tıkla.
