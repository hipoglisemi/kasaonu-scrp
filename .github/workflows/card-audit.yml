name: Campaign Cards Auditor

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maksimum taranacak kampanya sayısı (Boş bırakılırsa hepsi taranır)'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Campaign Cards Auditor
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
        GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
        GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
        GEMINI_FAST_MODEL: "gemini-3.1-flash-lite"
      run: |
        LIMIT_ARG=""
        if [ ! -z "${{ github.event.inputs.limit }}" ]; then
          LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
        fi
        python audit_eligible_cards.py $LIMIT_ARG

    - name: Upload Audit Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: card-audit-report
        path: |
          card_audit_report.json
        retention-days: 7

    - name: Bildirim Gönder
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.GMAIL_USER }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        to: ${{ secrets.GMAIL_USER }}
        from: KartAvantaj CI <${{ secrets.GMAIL_USER }}>
        subject: "${{ job.status == 'success' && '✅' || '❌' }} ${{ github.workflow }} — ${{ job.status }}"
        body: |
          Workflow: ${{ github.workflow }}
          Durum: ${{ job.status }}
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Tetikleyen: ${{ github.event_name }}
          Çalışma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Rapor dosyası (card_audit_report.json) artifact olarak yüklenmiştir. İndirmek için yukarıdaki linke tıkla.
