# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Kart Bilgisi Scraper

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * 0'

jobs:
  scrape-card-details:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            psycopg2-binary \
            python-dotenv \
            playwright \
            beautifulsoup4 \
            google-genai \
            requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run Card Details Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/scrape_card_details.py

      - name: Bildirim Gönder
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.GMAIL_USER }}
          from: KartAvantaj CI <${{ secrets.GMAIL_USER }}>
          subject: "${{ job.status == 'success' && '✅' || '❌' }} Kart Bilgisi Scraper — ${{ job.status }}"
          body: |
            Kart bilgisi scraper tamamlandı.
            Durum: ${{ job.status }}
            Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
