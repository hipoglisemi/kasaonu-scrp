name: Cleanup Expired Campaigns

on:
  push:
    paths:
      - '.github/workflows/cleanup-campaigns.yml'
  schedule:
    # TSİ 04:15 (UTC 01:15) - Tüm Scraper taramalarından sonra çalışır
    - cron: '15 1 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  cleanup-campaigns:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Cleanup Script
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SEARCH_CONSOLE_KEY: ${{ secrets.SEARCH_CONSOLE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
        GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
        GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
        REVERSE_KEYS: "True"
      run: |
        python scripts/cleanup_expired.py

    - name: Bildirim Gönder
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.GMAIL_USER }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        to: ${{ secrets.GMAIL_USER }}
        from: KartAvantaj CI <${{ secrets.GMAIL_USER }}>
        subject: "${{ job.status == 'success' && '✅' || '❌' }} ${{ github.workflow }} — ${{ job.status }}"
        body: |
          Workflow: ${{ github.workflow }}
          Durum: ${{ job.status }}
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Tetikleyen: ${{ github.event_name }}
          Çalışma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Detaylar için yukarıdaki linke tıkla.
