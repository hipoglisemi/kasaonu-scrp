# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Google Indexing Otomasyonu

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  submit-to-google:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv google-auth google-api-python-client

      - name: Run Google Indexing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEARCH_CONSOLE_KEY: ${{ secrets.SEARCH_CONSOLE_KEY }}
        run: |
          python submit_to_google.py
