name: Kartavantaj Auto Scrapers

run-name: "🤖 Scraper: ${{ github.event.inputs.scraper || 'Tümü (Zamanlı)' }}"

on:
  workflow_dispatch:
    inputs:
      scraper:
        description: 'Çalıştırılacak scraper'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ahlpay
          - hayatpay
          - hayatfinans
          - alternatifbank
          - odeabank
          - akbank_axess
          - akbank_business
          - akbank_free
          - akbank_wings
          - akbank_kart
          - albaraka
          - americanexpress
          - anadolubank
          - chippin
          - denizbank
          - dunyakatilim
          - emlakkatilim
          - enpara
          - garanti_bonus
          - garanti_milesandsmiles
          - garanti_shopandfly
          - garanti
          - hayhay
          - hsbc
          - isbankasi_genc
          - isbankasi_maximiles
          - isbankasi_maximum
          - istanbulkart
          - kuveytturk
          - masterpass
          - nays
          - nkolay
          - on_digital
          - opet
          - paraf
          - paraf_genc
          - param
          - paycell
          - pep
          - petrolofisi
          - pokus
          - qnb
          - gspara
          - fenerpara
          - rubikpara
          - sekerbank
          - shell
          - tami
          - teb
          - tkpay
          - tombank
          - totalenergies
          - turkcell
          - turkiyefinans
          - turktelekom
          - uption
          - vakif_katilim
          - vakifbank
          - vodafone
          - vodafonepay
          - yapikredi_adios
          - yapikredi_crystal
          - yapikredi_play
          - yapikredi_world
          - ziraat
          - ziraat_dinamik
          - ziraat_katilim
          - isbankasi
      limit:
        description: 'Çekilecek max kampanya sayısı (Sadece İşbankası için desteklenir, boş bırakılırsa limitsiz)'
        required: false
        default: ''

jobs:
  # Step 1: Compute which scrapers to run
  setup:
    runs-on: ubuntu-22.04
    outputs:
      scrapers: ${{ steps.set-matrix.outputs.scrapers }}
    steps:
      - id: set-matrix
        run: |
          ALL='["ahlpay","hayatpay","hayatfinans","alternatifbank","odeabank","akbank_axess","akbank_business","akbank_free","akbank_wings","akbank_kart","albaraka","americanexpress","anadolubank","chippin","denizbank","dunyakatilim","emlakkatilim","enpara","garanti_bonus","garanti_milesandsmiles","garanti_shopandfly","garanti","hayhay","hsbc","isbankasi_genc","isbankasi_maximiles","isbankasi_maximum","isbankasi","istanbulkart","kuveytturk","masterpass","nays","nkolay","on_digital","opet","paraf","paraf_genc","param","paycell","pep","petrolofisi","pokus","qnb","gspara","fenerpara","rubikpara","sekerbank","shell","tami","teb","tkpay","tombank","totalenergies","turkcell","turkiyefinans","turktelekom","uption","vakif_katilim","vakifbank","vodafone","vodafonepay","yapikredi_adios","yapikredi_crystal","yapikredi_play","yapikredi_world","ziraat","ziraat_dinamik","ziraat_katilim"]'
          INPUT="${{ github.event.inputs.scraper }}"
          if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
            echo "scrapers=$ALL" >> $GITHUB_OUTPUT
          else
            echo "scrapers=[\"$INPUT\"]" >> $GITHUB_OUTPUT
          fi

  # Step 2: Run selected scrapers in parallel
  scrape:
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        scraper: ${{ fromJson(needs.setup.outputs.scrapers) }}

    name: "🤖 ${{ matrix.scraper }}"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies (Chrome & Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable xvfb

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install selenium-stealth pyvirtualdisplay webdriver-manager

    - name: Install Playwright Browsers
      run: |
        playwright install chromium firefox

    - name: Run Scraper
      env:
        DATABASE_URL: ${{ secrets['DATABASE_URL'] || '' }}
        GEMINI_API_KEY: ${{ secrets['GEMINI_API_KEY'] }}
        GEMINI_API_KEY_1: ${{ secrets['GEMINI_API_KEY_1'] }}
        GEMINI_API_KEY_2: ${{ secrets['GEMINI_API_KEY_2'] }}
        GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
        GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
        GEMINI_MODEL: "gemini-3.1-flash-lite"
        USE_VERTEX_AI: "False"
        PYTHONPATH: ${{ github.workspace }}
        PYTHONUNBUFFERED: '1'
        DISPLAY: ':99'
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 2
        
        LIMIT_ARG=""
        if [ -n "${{ github.event.inputs.limit }}" ]; then
          LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
        fi
        
        if [[ "${{ matrix.scraper }}" == isbankasi_* || "${{ matrix.scraper }}" == opet || "${{ matrix.scraper }}" == petrolofisi || "${{ matrix.scraper }}" == shell || "${{ matrix.scraper }}" == totalenergies ]] && [ -n "$LIMIT_ARG" ]; then
          python -u src/scrapers/${{ matrix.scraper }}.py $LIMIT_ARG
        else
          python -u src/scrapers/${{ matrix.scraper }}.py
        fi

    - name: Bildirim Gönder
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.GMAIL_USER }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        to: ${{ secrets.GMAIL_USER }}
        from: KartAvantaj CI <${{ secrets.GMAIL_USER }}>
        subject: "${{ job.status == 'success' && '✅' || '❌' }} ${{ github.workflow }} — ${{ job.status }}"
        body: |
          Workflow: ${{ github.workflow }}
          Durum: ${{ job.status }}
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Tetikleyen: ${{ github.event_name }}
          Çalışma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Detaylar için yukarıdaki linke tıkla.




