name: Proactive Expiry Audit (AI Campaign Extension)

on:
  push:
    paths:
      - '.github/workflows/proactive-expiry-audit.yml'
  workflow_call:
  workflow_dispatch: # Allow manual trigger
    inputs:
      max_audits:
        description: 'Maksimum taranacak kampanya sayısı (Kota limitini korumak için)'
        required: true
        default: '2500'

jobs:
  proactive-expiry-audit:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install System Dependencies (Chrome & Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable xvfb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install selenium-stealth pyvirtualdisplay webdriver-manager playwright
        
    - name: Install Playwright Browsers
      run: |
        playwright install chromium

    - name: Run Proactive Expiry Audit
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GEMINI_PROACTIVE_API_KEY: ${{ secrets.GEMINI_PROACTIVE_API_KEY }}
        DISPLAY: ':99'
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 2
        
        # Use dispatch input or default to 2000
        MAX_AUDITS="${{ github.event.inputs.max_audits || '2500' }}"
        echo "🚀 Running proactive expiry audit with max_audits=$MAX_AUDITS"
        python -u scripts/proactive_expiry_audit.py $MAX_AUDITS

    - name: Run System-Wide Extension Audit (Anomaly Detection)
      if: always()
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        echo "🔍 Running system-wide extension audit for anomaly detection..."
        python -u scripts/system_wide_extension_audit.py

    - name: Bildirim Gönder
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.GMAIL_USER }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        to: ${{ secrets.GMAIL_USER }}
        from: Kasaonu CI <${{ secrets.GMAIL_USER }}>
        subject: "${{ job.status == 'success' && '✅' || '❌' }} ${{ github.workflow }} — ${{ job.status }}"
        body: |
          Workflow: ${{ github.workflow }}
          Durum: ${{ job.status }}
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Tetikleyen: ${{ github.event_name }}
          Çalışma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Detaylar için yukarıdaki linke tıkla.
