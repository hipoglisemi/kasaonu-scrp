name: Proactive Expiry Audit (AI Campaign Extension)

on:
  push:
    paths:
      - '.github/workflows/proactive-expiry-audit.yml'
  schedule:
    # TSİ 00:30 (UTC 21:30) — Günün ilk işi
    - cron: '23 21 * * *'
    # TSİ 09:00 (UTC 06:00) — Her ayın 1'i
    - cron: '0 6 1 * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      max_audits:
        description: 'Maksimum taranacak kampanya sayısı (Kota limitini korumak için)'
        required: true
        default: '2000'

jobs:
  proactive-expiry-audit:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install System Dependencies (Chrome & Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable xvfb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install selenium-stealth pyvirtualdisplay webdriver-manager playwright
        
    - name: Install Playwright Browsers
      run: |
        playwright install chromium

    - name: Run Proactive Expiry Audit
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
        GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
        GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
        GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
        REVERSE_KEYS: "False"
        DISPLAY: ':99'
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 2
        
        # Use dispatch input or default to 2000
        MAX_AUDITS="${{ github.event.inputs.max_audits || '2000' }}"
        echo "🚀 Running proactive expiry audit with max_audits=$MAX_AUDITS"
        python -u scripts/proactive_expiry_audit.py $MAX_AUDITS

    - name: Bildirim Gönder
      if: always()
      uses: dawidd6/action-send-mail@v18
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.GMAIL_USER }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        to: ${{ secrets.GMAIL_USER }}
        from: KartAvantaj CI <${{ secrets.GMAIL_USER }}>
        subject: "${{ job.status == 'success' && '✅' || '❌' }} ${{ github.workflow }} — ${{ job.status }}"
        body: |
          Workflow: ${{ github.workflow }}
          Durum: ${{ job.status }}
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Tetikleyen: ${{ github.event_name }}
          Çalışma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Detaylar için yukarıdaki linke tıkla.
