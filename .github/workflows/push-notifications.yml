name: "🔔 Push Bildirimleri Gönder"
# Grup E bittikten sonra çalışır (tüm scraperlar tamamlandı)
# TSİ 06:00 → UTC 03:00
on:
  schedule:
    - cron: '0 3 * * *'   # TSİ 06:00 (UTC 03:00) — Grup E'den (~45dk) sonra
  workflow_dispatch: {}

jobs:
  send-push:
    name: "🔔 Push Notification Gönder"
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary pywebpush python-dotenv

    - name: Push Bildirimleri Gönder
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
      run: |
        python send_push_notifications.py
