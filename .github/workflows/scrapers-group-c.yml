name: "🆑 Scrapers – Grup C"
# İşbankası (Genç + Maximiles + Maximum), Masterpass, Paraf (x2), Param, QNB
# TSİ 04:00 → UTC 01:00
on:
  schedule:
    - cron: '30 22 * * *'   # TSİ 01:30 (UTC 22:30)
  workflow_dispatch:
    inputs:
      scraper:
        description: 'Çalıştırılacak Scraper (Hepsini çalıştırmak için ALL bırakın)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - isbankasi_genc
          - isbankasi_maximiles
          - isbankasi_maximum
          - masterpass
          - paraf
          - paraf_genc
          - param
          - qnb

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ github.event.inputs.scraper }}" == "" || "${{ github.event.inputs.scraper }}" == "ALL" ]]; then
            echo 'matrix=["isbankasi_genc", "isbankasi_maximiles", "isbankasi_maximum", "masterpass", "paraf", "paraf_genc", "param", "qnb"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["${{ github.event.inputs.scraper }}"]' >> $GITHUB_OUTPUT
          fi

  scrape:
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scraper: ${{ fromJson(needs.setup.outputs.matrix) }}

    name: "🤖 ${{ matrix.scraper }}"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable xvfb

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install selenium-stealth pyvirtualdisplay webdriver-manager

    - name: Install Playwright Browsers
      run: playwright install chromium firefox --with-deps

    - name: Run Scraper
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
        GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
        GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
        GEMINI_MODEL: "gemini-3.1-flash-lite-preview"
        USE_VERTEX_AI: "False"
        PYTHONPATH: ${{ github.workspace }}
        PYTHONUNBUFFERED: '1'
        DISPLAY: ':99'
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 2
        python -u src/scrapers/${{ matrix.scraper }}.py

  notify:
    name: "📧 Hata Bildirimi"
    runs-on: ubuntu-22.04
    needs: [scrape]
    if: failure()
    steps:
      - name: Hata Maili Gönder
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.GMAIL_USER }}
          from: KartAvantaj CI <${{ secrets.GMAIL_USER }}>
          subject: "❌ Grup C — Hata Var!"
          body: |
            🆑 Scrapers – Grup C çalışmasında hata(lar) oluştu.

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Tetikleyen: ${{ github.event_name }}

            🔗 Detaylar için tıklayın:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Hata alan scraper(lar) için job loglarını inceleyiniz.
