name: "⛽ Scrapers – Grup F"
# Opet (Akaryakıt Grubu)
# TSİ 06:00 → UTC 03:00
on:
  schedule:
    - cron: '47 0 2-31 * *'
    - cron: '30 10 1 * *'   # TSİ 13:30 (Her Ayın 1i)
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scraper:
          - opet
          - petrolofisi
          - shell
          - totalenergies
          - alternatifbank
          - vodafonepay

    name: "🤖 ${{ matrix.scraper }}"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable xvfb

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install selenium-stealth pyvirtualdisplay webdriver-manager

    - name: Install Playwright Browsers
      run: playwright install chromium --with-deps

    - name: Run Scraper
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
        GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
        GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
        GEMINI_MODEL: "gemini-3.1-flash-lite"
        USE_VERTEX_AI: "False"
        PYTHONPATH: ${{ github.workspace }}
        PYTHONUNBUFFERED: '1'
        DISPLAY: ':99'
        CRON_SECRET: ${{ secrets.CRON_SECRET }}
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 2
        python -u src/scrapers/${{ matrix.scraper }}.py

  notify:
    name: "📧 Hata Bildirimi"
    runs-on: ubuntu-22.04
    needs: [scrape]
    if: failure()
    steps:
      - name: Hata Maili Gönder
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.GMAIL_USER }}
          from: KartAvantaj CI <${{ secrets.GMAIL_USER }}>
          subject: "❌ Grup F — Hata Var!"
          body: |
            ⛽ Scrapers – Grup F (Akaryakıt) çalışmasında hata(lar) oluştu.

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Tetikleyen: ${{ github.event_name }}

            🔗 Detaylar için tıklayın:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Hata alan scraper(lar) için job loglarını inceleyiniz.
