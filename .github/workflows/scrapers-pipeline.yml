name: "🔄 Scheduled Scrapers Pipeline"

on:
  schedule:
    # TSİ 00:23 (UTC 21:23) — Ayın 2-31'i her gün (UTC+3 offset: UTC'de 1-30 görünür)
    - cron: '23 21 1-30 * *'
    # TSİ 09:00 (UTC 06:00) — Her ayın 1'i
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  proactive:
    name: "🕰️ Proactive Expiry Audit"
    uses: ./.github/workflows/proactive-expiry-audit.yml
    secrets: inherit

  cleanup:
    name: "🧹 Cleanup Campaigns"
    needs: proactive
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cleanup-campaigns.yml
    secrets: inherit

  group-a:
    name: "🅰️ Scrapers – Grup A"
    needs: cleanup
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/scrapers-group-a.yml
    secrets: inherit

  group-b:
    name: "🅱️ Scrapers – Grup B"
    needs: group-a
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/scrapers-group-b.yml
    secrets: inherit

  group-c:
    name: "🆑 Scrapers – Grup C"
    needs: group-b
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/scrapers-group-c.yml
    secrets: inherit

  group-d:
    name: "🆗 Scrapers – Grup D"
    needs: group-c
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/scrapers-group-d.yml
    secrets: inherit

  group-e:
    name: "🍬 Scrapers – Grup E"
    needs: group-d
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/scrapers-group-e.yml
    secrets: inherit

  group-f:
    name: "⛽ Scrapers – Grup F"
    needs: group-e
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/scrapers-group-f.yml
    secrets: inherit

  autofix:
    name: "🛠️ Data Quality Auto-Fixer"
    needs: group-f
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/data-quality-autofix.yml
    secrets: inherit
