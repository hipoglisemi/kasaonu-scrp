# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SEO Blog Auto-Generator

on:
  schedule:
    - cron: '0 6 * * *'   # Her gün Türkiye 09:00
    - cron: '0 12 * * *'  # Her gün Türkiye 15:00
  workflow_dispatch:

jobs:
  generate-seo-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SEO Blog Generator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_seo_blog.py

      - name: Bildirim Gönder
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.GMAIL_USER }}
          from: KartAvantaj CI <${{ secrets.GMAIL_USER }}>
          subject: "${{ job.status == 'success' && '✅' || '❌' }} ${{ github.workflow }} — ${{ job.status }}"
          body: |
            Workflow: ${{ github.workflow }}
            Durum: ${{ job.status }}
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Tetikleyen: ${{ github.event_name }}
            Çalışma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Detaylar için yukarıdaki linke tıkla.
